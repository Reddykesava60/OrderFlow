# ============================================================================
# Order-Flow - Production Docker Compose
# ============================================================================

services:
  # ── Daphne ASGI (HTTP & WebSocket Traffic) ───────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderflow-web
    restart: always
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=dineflow.settings.prod
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - PAYMENT_JOBS_INLINE=False
    command: ["sh", "-c", "daphne --bind 0.0.0.0 --port 8000 --access-log - --proxy-headers dineflow.asgi:application"]
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orderflow-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/ready/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"



  # ── Celery Worker (Task Queue) ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderflow-worker
    restart: always
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=dineflow.settings.prod
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - PAYMENT_JOBS_INLINE=False
    command: ["celery", "-A", "dineflow", "worker", "-l", "info", "--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orderflow-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Celery Beat (Scheduler) ────────────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderflow-beat
    restart: always
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=dineflow.settings.prod
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - PAYMENT_JOBS_INLINE=False
    command: ["celery", "-A", "dineflow", "beat", "-l", "info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orderflow-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: orderflow-db
    restart: always
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_NAME:-orderflow}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - orderflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Cache, Channels, Broker) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: orderflow-redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - orderflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: orderflow-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - orderflow-net

  # ── Certbot (SSL Auto-renewal) ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: orderflow-certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  static_files:
  media_files:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_conf:

networks:
  orderflow-net:
    driver: bridge
