<!-- owner/templates/owner/mfa_verify.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{ APP_NAME }} - Verify MFA</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/tailwind.out.css' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex items-center justify-center p-6">
  <!-- Global Loader for Form Submission -->
  <div id="global-page-loader" class="fixed inset-0 bg-slate-50/80 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200" style="display: none;">
    <div class="bg-white p-6 rounded-3xl shadow-2xl shadow-brand-900/10 flex flex-col items-center gap-4 border border-brand-100">
      <svg class="w-8 h-8 animate-spin text-brand-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      <span class="text-sm font-black text-brand-800 tracking-wide">Loading...</span>
    </div>
  </div>
  <div class="w-full max-w-sm space-y-8">
    <div class="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-2xl shadow-slate-200 border border-slate-100 space-y-6">
      <div>
        <h2 class="text-xl font-black text-slate-900 tracking-tight">Two-Factor Auth</h2>
        <p class="text-xs font-medium text-slate-400 mt-1">Enter the 6-digit code from your authenticator app.</p>
      </div>

      {% if messages %}
        {% for message in messages %}
          <div class="bg-rose-50 border border-rose-100 p-4 rounded-2xl">
             <p class="text-[10px] font-black text-rose-600 uppercase tracking-widest text-center">{{ message }}</p>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-1.5">
           <label for="token" class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">6-digit Code</label>
           <input type="text" name="token" id="token" required autocomplete="off" autofocus
                  class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-5 py-4 text-sm font-bold focus:border-brand-300 outline-none transition-all placeholder:text-slate-300 text-center tracking-[0.5em]"
                  placeholder="000000" maxlength="6">
        </div>
        <button type="submit" class="w-full bg-brand-800 text-white py-5 rounded-3xl font-black uppercase tracking-[0.2em] shadow-xl shadow-brand-100 hover:bg-brand-900 active:scale-95 transition-all mt-4">
          Verify
        </button>
      </form>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.querySelector('form');
      const loader = document.getElementById('global-page-loader');
      let isSubmitting = false;

      if (form) {
        form.addEventListener('submit', (e) => {
          if (isSubmitting) {
            e.preventDefault();
            return;
          }
          isSubmitting = true;
          
          loader.style.display = 'flex';
          requestAnimationFrame(() => {
            loader.classList.remove('opacity-0', 'pointer-events-none');
            loader.classList.add('opacity-100');
          });
        });
      }

      window.addEventListener('pageshow', (e) => {
        if (e.persisted || isSubmitting) {
          isSubmitting = false;
          if (loader) {
            loader.classList.add('opacity-0', 'pointer-events-none');
            loader.classList.remove('opacity-100');
            setTimeout(() => {
              loader.style.display = 'none';
            }, 200);
          }
        }
      });
    });
  </script>
</body>
</html>
