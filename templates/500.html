<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internal Server Error</title>
  <style>
    :root {
      --brand: #1a3c5e;
      --accent: #e85d20;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #e2e8f0 0%, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.1;
      color: var(--brand);
    }
    p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }
    .btn {
      display: inline-block;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--brand);
      color: #fff;
    }
    .btn-ghost {
      border: 1px solid var(--border);
      color: var(--text);
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">500</div>
    <h1>Internal Server Error.</h1>
    <p>Oops, something went wrong on our end while processing your request.</p>
    <p>Our team has been notified. Please try again in a few minutes, or return to the home page.</p>
    <div class="actions">
      <a class="btn btn-primary" href="javascript:location.reload()">Refresh Page</a>
      <a class="btn btn-ghost" href="/">Go to Home</a>
    </div>
  </div>
</body>
</html>
