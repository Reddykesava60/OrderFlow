<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ restaurant.name }} — Closed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #f5f5f5; display: flex; align-items: center;
           justify-content: center; min-height: 100vh; padding: 24px; }
    .card { background: #fff; border-radius: 16px; padding: 40px 32px;
            max-width: 400px; width: 100%; text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
    p  { font-size: 15px; color: #6b7280; line-height: 1.6; }
    .msg { margin-top: 16px; padding: 12px 16px; background: #fef9c3;
           border-radius: 8px; font-size: 14px; color: #713f12; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🍽️</div>
    <h1>{{ restaurant.name }}</h1>
    <p>We're not taking orders right now.</p>
    {% if reopen_message %}
      <div class="msg">{{ reopen_message }}</div>
    {% endif %}
  </div>
</body>
</html>
