{% extends "owner/base.html" %}
{% block title %}Order #{{ order.order_number }}{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-8">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
    <div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Order #{{ order.order_number }}</h1>
      <p class="text-sm font-medium text-slate-400 mt-1 uppercase tracking-widest">Full Receipt Details</p>
    </div>
    <a href="{% url 'owner:dashboard' %}" class="inline-block bg-white text-slate-600 px-6 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-sm border border-slate-200 active:scale-95 transition-all hover:bg-slate-50">Back to Dashboard</a>
  </div>

  {% include "ordering/_receipt_card.html" %}

</div>
{% endblock %}
